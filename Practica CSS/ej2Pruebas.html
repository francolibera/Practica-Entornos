<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Prueba 2</title>
  <style>
      p#normal {
        font-family: arial,helvetica;
        font-size: 11px;
        font-weight: bold;
        }
      p#destacado {
        border-style: solid;
        border-color: blue;
        border-width: 2px;
        }
      p#distinto {
        background-color: #9EC7EB;
        color: red;
        }
  </style>
</head>

<body>

<p id="normal">Este es un párrafo</p>
<p id="destacado">Este es otro párrafo</p>
<table id="destacado">
  <tr>
    <td>Esta es una tabla</td>
  </tr>
</table>
<p id="distinto">Este es el último párrafo</p>

</body>

</html>
